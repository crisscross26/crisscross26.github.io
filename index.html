<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncy Bounty</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="index.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <div class="gamescreen">
      <!--MAIN MENU-->
      <div id="menu">
        <img
          src="asset/GUI/title.gif"
          height="90"
          style="
            position: relative;
            top: 150px;
            display: block;
            margin-left: auto;
            margin-right: auto;
          "
        />

        <div
          style="
            position: relative;
            top: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
          "
        >
          <img
            id="settings-btn"
            class="btn"
            src="asset/GUI/settings_btn.png"
            width="80"
            height="70"
          />

          <img
            id="start-btn"
            class="btn"
            src="asset/GUI/start_btn.png"
            width="190"
          />

          <img
            id="leaderboard-btn"
            class="btn"
            src="asset/GUI/leaderboard_btn.png"
            width="80"
            height="70"
          />
        </div>
      </div>

      <!--SETTINGS-->
      <div id="settings" class="general">
        <img
          id="return-btn"
          class="btn"
          src="asset/GUI/back_btn.png"
          width="60"
          style="position: relative; top: 30px; left: 30px"
        />
        <h1>Settings</h1>

        <table>
          <tr>
            <td>Music</td>
            <td>
              <img
                id="music-btn"
                src="asset/GUI/sound.png"
                data-alt-src="asset/GUI/mute.png"
                width="30"
              />
            </td>
            <td><input type="range" id="music-vol" /></td>
          </tr>

          <tr>
            <td>SFX</td>
            <td>
              <img id="sfx-btn" src="asset/GUI/sound.png" width="30" />
            </td>
            <td><input type="range" id="sfx-vol" /></td>
          </tr>
        </table>
      </div>

      <!--LEADERBOARD-->
      <div id="leaderboard" class="general">
        <img
          id="return-btn-leaderboard"
          class="btn"
          src="asset/GUI/back_btn.png"
          width="60"
          style="position: relative; top: 30px; left: 30px"
        />

        <img
          src="asset/GUI/crown.png"
          width="60"
          style="
            position: relative;
            top: 14px;
            display: block;
            margin-left: auto;
            margin-right: auto;
          "
        />
        <h1>Best Score</h1>
      </div>

      <!--GAME MODES-->
      <div id="difficulty" class="general">
        <img
          id="return-btn-difficulty"
          class="btn"
          src="asset/GUI/back_btn.png"
          width="60"
          style="position: relative; top: 30px; left: 30px"
        />

        <h1>Difficulties</h1>

        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px 0 0 0;
          "
        >
          <img
            id="easy-btn"
            class="btn"
            src="asset/GUI/easy_btn.png"
            width="180"
          />

          <img
            id="normal-btn"
            class="btn"
            src="asset/GUI/normal_btn.png"
            width="180"
          />

          <img
            id="hard-btn"
            class="btn"
            src="asset/GUI/hard_btn.png"
            width="180"
          />
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
