<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncy Bounty</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        background-color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }
      .gamescreen {
        width: 800px;
        height: 450px;
      }
    </style>
  </head>
  <body>
    <div
      class="gamescreen"
      style="
        background-image: url('asset/background/free1.JPG');
        background-repeat: no-repeat;
        background-size: cover;
        align-items: center;
      "
    >
      <img
        src="asset/GUI/title.gif"
        height="90"
        style="
          position: relative;
          top: 150px;
          display: block;
          margin-left: auto;
          margin-right: auto;
        "
      />

      <!--buttons-->
      <div
        style="
          position: relative;
          top: 170px; /* Pushes it down from where it usually sits */
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <img src="asset/GUI/settings_btn.png" width="60" height="60" />
        <img
          src="asset/GUI/start_btn.png"
          width="190"
          style="margin: 0 15px 0 15px"
        />
        <img src="asset/GUI/leaderboard_btn.png" width="60" height="60" />
      </div>
    </div>

    <script></script>
  </body>
</html>
